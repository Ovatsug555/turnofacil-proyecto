<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurnoFácil - Sistema Integral de Reservas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Sistema de Gestión - TurnoFácil</h1>
        
        <form id="formTurno">
            <label for="usuario">Nombre del Cliente:</label>
            <input type="text" id="usuario" required placeholder="Ej: Gustavo Pérez">

            <label for="email">Correo Electrónico (Notificaciones):</label>
            <input type="email" id="email" required placeholder="cliente@email.com">

            <label for="servicio">Servicio:</label>
            <select id="servicio" required>
                <option value="Consulta General">Consulta General</option>
                <option value="Atención Especializada">Atención Especializada</option>
                <option value="Soporte Técnico">Soporte Técnico</option>
            </select>

            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" required>

            <label for="hora">Hora:</label>
            <input type="time" id="hora" required>

            <button type="submit">Confirmar Reserva</button>
        </form>

        <h2>Panel de Turnos Registrados</h2>
        <input type="text" id="buscador" placeholder="Buscar por cliente o servicio..." style="margin-bottom: 10px;">
        <ul id="listaTurnos"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
